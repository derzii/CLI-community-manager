[package]
name = "theblackroom"
version = "0.1.0"
edition = "2021"
description = "Community management tool for TheBlackroom"

[[bin]]
name = "tbr"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "=1.35.1", features = ["full"] }

# TUI
ratatui   = "=0.25.0"
crossterm = "=0.27.0"

# HTTP – covers Notion + Discord REST APIs (no Python needed)
reqwest = { version = "=0.11.27", features = ["json"] }

# Serialization
serde      = { version = "=1.0.196", features = ["derive"] }
serde_json = "=1.0.113"
toml       = "=0.8.10"

# SQLite activity log (bundled = no system libsqlite3 dep)
rusqlite = { version = "=0.31.0", features = ["bundled"] }

# Utilities
chrono    = { version = "=0.4.33", features = ["serde"] }
uuid      = { version = "=1.7.0",  features = ["v4"] }
dirs      = "=5.0.1"
anyhow    = "=1.0.79"
thiserror = "=1.0.56"

# ── Transitive dependency pins ────────────────────────────────────────────────
# Prevents pulling crates that require edition2024 (needs Cargo 1.85+).
# Remove these pins after upgrading Rust to 1.85+ via rustup.
indexmap = "=2.2.6"
url      = "=2.4.1"
idna     = "=0.5.0"
